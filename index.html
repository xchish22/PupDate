<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pupdate</title>
<meta name="description" content="Track your pet's growth, vaccines, medications, vet records and appointments.">
<meta name="theme-color" content="#F5F8F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A1E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pupdate">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column phone app — sticky pet switcher on top, scrolling view, fixed tab bar at the bottom. */
/* Palette: soft pastels (mint, sky, peach, lavender) on a cool off-white, slate text, sea-green accent. */
:root{
  --bg:#F5F8F6; --surface:#FFFFFF; --surface2:#EAF2EF; --ink:#26343B; --muted:#62737B;
  --accent:#337A70; --accent-ink:#FFFFFF; --gold:#F0B693; --line:#DFE7E4;
  --mint:#DDF2E9; --sky:#DDEBF8; --peach:#FDE6D7; --lav:#E9E4F6;
  --p1:#337A70; --p2:#D9844F; --p3:#5B86CC; --p4:#8F72CC;
  --good:#2B7A57; --warn:#AD6418; --bad:#BC3F3B;
  --shadow:0 8px 24px -14px rgba(38,52,59,.28);
  --display:"Nunito","Avenir Next",-apple-system,system-ui,sans-serif;
  --body:"Nunito","Avenir Next",-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A1E; --surface:#1B2429; --surface2:#233138; --ink:#E8F0EE; --muted:#9DAEB3;
  --accent:#8ED3C4; --accent-ink:#10302B; --gold:#E9B48F; --line:#2D3B41;
  --mint:#1E3832; --sky:#1D3145; --peach:#3B2C24; --lav:#2C2A40;
  --p1:#8ED3C4; --p2:#F0AE85; --p3:#8FB2EC; --p4:#B9A2EE;
  --good:#7FD3A8; --warn:#F2B36B; --bad:#FF8F85; --shadow:0 8px 24px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A1E; --surface:#1B2429; --surface2:#233138; --ink:#E8F0EE; --muted:#9DAEB3;
  --accent:#8ED3C4; --accent-ink:#10302B; --gold:#E9B48F; --line:#2D3B41;
  --mint:#1E3832; --sky:#1D3145; --peach:#3B2C24; --lav:#2C2A40;
  --p1:#8ED3C4; --p2:#F0AE85; --p3:#8FB2EC; --p4:#B9A2EE;
  --good:#7FD3A8; --warn:#F2B36B; --bad:#FF8F85; --shadow:0 8px 24px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{margin:0;font:800 26px/1 var(--display);letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.savedto{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:8px;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px 4px 4px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{padding:4px 14px;color:var(--accent);border-style:dashed}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--surface2);display:grid;place-items:center;font:800 15px var(--display);color:var(--accent);flex:none;overflow:hidden}
.chip.on .av{color:var(--accent)}

main{padding-block:18px 110px}
.view{display:flex;flex-direction:column;gap:18px}

/* hero */
.hero{display:flex;gap:16px;align-items:center}
.hero .photo{width:96px;height:96px;border-radius:50%;flex:none;overflow:hidden;background:var(--surface2);display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--gold)}
.hero .photo img{width:100%;height:100%;object-fit:cover}
.hero .photo span{font:800 40px var(--display);color:var(--accent)}
.hero h2{margin:0;font:800 clamp(34px,10vw,46px)/1 var(--display);letter-spacing:-.02em;text-wrap:balance}
.hero p{margin:6px 0 0;color:var(--muted)}
.tag{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}

/* sections */
.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sechead h3{margin:0;font:800 22px/1.1 var(--display)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid transparent;border-radius:16px;padding:12px;min-width:0}
.stat b{display:block;font:800 22px/1.15 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:2px}
.row:last-child{padding-bottom:2px}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.date{flex:none;width:46px;text-align:center;border-radius:12px;background:var(--surface2);padding:6px 0;line-height:1}
.date b{display:block;font:800 20px var(--display)}
.date small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pill{flex:none;font-size:11px;font-weight:600;letter-spacing:.04em;padding:4px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.mute{color:var(--muted)}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink);letter-spacing:.02em}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;font-size:14px}
.icon-btn{background:none;border:0;color:var(--muted);padding:6px;border-radius:10px;flex:none}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:10px 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.kv{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px 14px;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;overflow-wrap:anywhere}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:600 11px var(--body)}
.stat:nth-child(1){background:var(--mint)}.stat:nth-child(2){background:var(--sky)}.stat:nth-child(3){background:var(--peach)}
.stat .eyebrow{color:var(--ink);opacity:.7}
.date{background:var(--sky)!important}
.chip.add{background:var(--mint)}
.welcome .note,.note{background:var(--lav)}
.attn .row .dot{width:8px;height:8px;border-radius:50%;flex:none}

/* welcome */
.welcome{text-align:left;padding-block:24px;display:flex;flex-direction:column;gap:16px}
.welcome h2{margin:0;font:800 clamp(34px,10vw,48px)/1.05 var(--display);letter-spacing:-.02em}
.welcome h2 em{color:var(--accent);font-style:normal}
.welcome p{margin:0;color:var(--muted);max-width:40ch}
.welcome ul{margin:0;padding-left:18px;color:var(--ink)}
.welcome .acts{display:flex;gap:10px;flex-wrap:wrap}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-block:6px}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.03em}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--accent)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,30,36,.4)}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.panel h3{margin:0;font:800 28px/1.1 var(--display)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px}
.field textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.panel .acts{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding-top:4px}
.panel .acts .r{display:flex;gap:10px;margin-left:auto}
.photo-pick{display:flex;align-items:center;gap:12px}
.photo-pick .av{width:64px;height:64px;font-size:26px}
.confirm{border:1px solid var(--bad);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;color:var(--ink)}

.calcard{padding:12px}
.calhead{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.calhead b{font:800 18px var(--display);flex:1;text-align:center}
.calhead .icon-btn{font-size:24px;line-height:1;width:40px;height:40px;color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .wd{font-size:12px;text-align:center;color:var(--muted);font-weight:700;padding:2px 0 6px}
.cal .d{border:0;background:none;border-radius:12px;min-height:46px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 4px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.cal .d .n{width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.cal .d.out{opacity:.38}
.cal .d.today .n{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.cal .d.sel{background:var(--mint)}
.cal .d.sel .n{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.cal .dots{display:flex;gap:3px;height:6px}.cal .dots i{width:6px;height:6px;border-radius:50%}
.time{flex:none;width:58px;font-weight:800;font-size:14px;color:var(--accent);font-variant-numeric:tabular-nums}
.petdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.barrow{display:grid;grid-template-columns:84px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:14px}
.barrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.barrow .bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.barrow b{font-variant-numeric:tabular-nums}
.remind{display:flex;flex-direction:column;gap:8px}
.remrow{display:flex;gap:12px;align-items:center;border:0;background:var(--peach);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.35}
.remrow small{color:var(--muted);font-size:13px}
.bellc{width:34px;height:34px;flex:none;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--p2)}
.qform{display:flex;gap:8px}.qform input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:16px}
details summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:14px;padding:4px 0}
.ck{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;align-self:flex-start;margin-top:1px}
.ck.ok{background:var(--mint);color:var(--good)}.ck.no{background:var(--peach);color:var(--warn)}.ck.info{background:var(--sky);color:var(--p3);font-style:italic;font-family:Georgia,serif}
.ckacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.ckacts a{text-decoration:none}
.note a{color:var(--accent);font-weight:700}
.ver ul{margin:6px 0 0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.verhead{display:flex;align-items:center;gap:8px}.verhead .s{color:var(--muted);font-size:13px;margin-left:auto}
.gear{color:var(--ink);padding:4px}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--accent-ink);font-weight:800;font-size:16px;display:grid;place-items:center;padding:0}
.chk.on{background:var(--accent);border-color:var(--accent)}
.row.given .t{color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;max-width:calc(100% - 32px)}
.loading{padding:40px 0;color:var(--muted);font:600 20px var(--display)}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><h1>Pup<span>date</span></h1><div style="display:flex;align-items:center;gap:6px"><span class="savedto" id="savedto"></span><button class="icon-btn gear" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div></div>
  <div class="chips" id="chips"></div>
</div></header>
<main><div class="wrap view" id="view"><div class="loading">Fetching your babies…</div></div></main>
<nav class="tabs" id="tabs" hidden><div class="wrap" id="tabbtns"></div></nav>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>
<datalist id="breeds"></datalist><datalist id="vaxnames"><option value="DA2PP"><option value="Rabies"><option value="Leptospirosis"><option value="Lyme"><option value="Bordetella"><option value="Canine influenza"></datalist>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const DAY=864e5;
const pad=n=>String(n).padStart(2,"0");
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const parseD=s=>{if(!s)return null;const [y,m,d]=s.slice(0,10).split("-").map(Number);if(!y)return null;const t=new Date(y,m-1,d);if(s.length>10){const [hh,mm]=s.slice(11,16).split(":").map(Number);t.setHours(hh||0,mm||0)}return t};
const startOfToday=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const daysUntil=s=>{const d=parseD(s);if(!d)return null;const x=new Date(d);x.setHours(0,0,0,0);return Math.round((x-startOfToday())/DAY)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+Number(n));return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD=s=>{const d=parseD(s);return d?MON[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear():""};
const fmtShort=s=>{const d=parseD(s);return d?MON[d.getMonth()]+" "+d.getDate():""};
const fmtTime=s=>{if(!s||s.length<16)return"";const d=parseD(s);let h=d.getHours(),m=d.getMinutes();const ap=h<12?"am":"pm";h=h%12||12;return h+(m?":"+pad(m):"")+ap};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
const clone=o=>JSON.parse(JSON.stringify(o));

function ageParts(bday){
  const b=parseD(bday);if(!b)return null;
  const days=Math.floor((startOfToday()-b)/DAY);if(days<0)return null;
  const weeks=Math.floor(days/7);
  const now=new Date();let months=(now.getFullYear()-b.getFullYear())*12+(now.getMonth()-b.getMonth());if(now.getDate()<b.getDate())months--;
  return {days,weeks,months};
}
function ageText(bday){
  const a=ageParts(bday);if(!a)return"";
  if(a.weeks<26)return a.weeks+(a.weeks===1?" week":" weeks")+" old";
  if(a.months<24)return a.months+" months old";
  const y=Math.floor(a.months/12),m=a.months%12;return y+" yr"+(m?" "+m+" mo":"")+" old";
}
function ageShort(bday){const a=ageParts(bday);if(!a)return["—",""];if(a.weeks<26)return[a.weeks,"weeks old"];if(a.months<24)return[a.months,"months old"];return[(a.months/12).toFixed(1),"years old"]}

/* ---------- state ---------- */
const PREF="pawlette.prefs",LOCAL="pawlette.pets";
const prefs=Object.assign({unit:"lb",cur:null,tab:"home"},lsGet(PREF,{}));
const S={pets:[],loading:true,mode:"local",note:"",confirmDel:false};
const savePrefs=()=>lsSet(PREF,prefs);
const cur=()=>S.pets.find(p=>p.id===prefs.cur)||S.pets[0]||null;

/* ---------- storage: on this device (localStorage) ---------- */
function initStore(){
  S.pets=lsGet(LOCAL,[]);S.loading=false;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  render();
}
function saveAll(){if(!lsSet(LOCAL,S.pets))toast("This phone is out of space for Pupdate. Try smaller photos.")}

/* ---------- backup & restore ---------- */
async function exportBackup(){
  const data={app:"pupdate",version:DATA_VERSION,appVersion:APP_VERSION,exportedAt:new Date().toISOString(),pets:S.pets};
  const name="pupdate-backup-"+todayISO()+".json";
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  let done=false;
  try{const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Pupdate backup"});done=true}}
  catch(e){if(e&&e.name==="AbortError")return}
  if(!done){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
  prefs.lastBackup=todayISO();savePrefs();toast("Backup saved");render();
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){toast("That file isn't a Pupdate backup.");return}
    const pets=d&&(d.app==="pupdate"||d.app==="pawlette")&&Array.isArray(d.pets)?d.pets:null;
    if(!pets){toast("That file isn't a Pupdate backup.");return}
    if((d.version||1)>DATA_VERSION){toast("This backup is from a newer Pupdate ("+(d.appVersion||"?")+"). Update the app first.");return}
    let n=0;pets.forEach(p=>{if(!p||!p.id||!p.name)return;const i=S.pets.findIndex(x=>x.id===p.id);if(i<0)S.pets.push(p);else S.pets[i]=p;n++});
    saveAll();if(!prefs.cur&&S.pets[0]){prefs.cur=S.pets[0].id;savePrefs()}
    toast("Restored "+n+(n===1?" pet":" pets"));render()};
  r.onerror=()=>toast("That file couldn't be read.");
  r.readAsText(file);
}

function dueStatus(days){if(days==null)return null;if(days<0)return["bad",Math.abs(days)+"d overdue"];if(days===0)return["warn","Due today"];if(days<=14)return["warn","Due in "+days+"d"];return["good","Due "+""];}

function attention(p){
  const out=[];
  (p.vaccines||[]).filter(v=>!superseded(p,v)).forEach(v=>{const d=daysUntil(v.due);if(d!=null&&d<=14)out.push({d,t:v.name+" booster",s:d<0?Math.abs(d)+" days overdue":d===0?"Due today":"Due "+fmtShort(v.due),lvl:d<0?"bad":"warn",act:"vax-edit",id:v.id})});
  (p.meds||[]).forEach(m=>{const n=medNext(m);const d=daysUntil(n);if(d!=null&&d<=3)out.push({d,t:m.name,s:d<0?Math.abs(d)+" days overdue":d===0?"Due today":"Due "+fmtShort(n),lvl:d<0?"bad":"warn",act:"med-give",id:m.id,btn:"Given"})});
  planItems(p).filter(s=>s.core&&s.st==="due"&&!(p.vaccines||[]).some(v=>vKey(v.name)===s.key&&v.due&&!superseded(p,v))).forEach(s=>out.push({d:s.d,t:s.label,s:s.d<0?"Due now (typical timing)":"Due around "+fmtShort(s.target),lvl:"warn",act:"go-health",id:""}));
  {const q=openQs(p).length;const nv=(p.appts||[]).filter(a=>!a.done&&a.type==="Vet"&&daysUntil(a.when)>=0&&daysUntil(a.when)<=14).sort((x,y)=>x.when<y.when?-1:1)[0];if(q&&nv)out.push({d:daysUntil(nv.when)-.5,t:q+(q===1?" question":" questions")+" for the vet",s:"Bring them to "+(nv.title||"the vet")+" on "+fmtShort(nv.when),lvl:"mute",act:"go-health",id:""})}
  (p.appts||[]).filter(a=>!a.done).forEach(a=>{const d=daysUntil(a.when);if(d!=null&&d>=0&&d<=7)out.push({d,t:a.title||a.type,s:(d===0?"Today":d===1?"Tomorrow":fmtShort(a.when))+(fmtTime(a.when)?" · "+fmtTime(a.when):""),lvl:"mute",act:"appt-edit",id:a.id})});
  return out.sort((a,b)=>a.d-b.d);
}

function chart(ws,compact){
  const pts=ws.map(w=>({t:parseD(w.date).getTime(),v:prefs.unit==="kg"?w.lb*KG:+w.lb}));
  const W=340,H=compact?150:200,L=34,R=12,T=14,B=24;
  const t0=pts[0].t,t1=pts[pts.length-1].t||t0+1;const span=Math.max(t1-t0,DAY);
  let vmin=Math.min(...pts.map(p=>p.v)),vmax=Math.max(...pts.map(p=>p.v));
  const step=niceStep((vmax-vmin)||vmax||1);vmin=Math.max(0,Math.floor(vmin/step)*step);vmax=Math.ceil(vmax/step)*step;if(vmax===vmin)vmax=vmin+step;
  const x=t=>L+(t-t0)/span*(W-L-R),y=v=>T+(1-(v-vmin)/(vmax-vmin))*(H-T-B);
  let grid="";for(let g=vmin;g<=vmax+1e-9;g+=step){grid+=`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(g)+4}" text-anchor="end">${+g.toFixed(1)}</text>`}
  const line=pts.map((p,i)=>(i?"L":"M")+x(p.t).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const area=line+` L${x(pts[pts.length-1].t).toFixed(1)} ${H-B} L${x(t0).toFixed(1)} ${H-B} Z`;
  const lp=pts[pts.length-1];
  const lab=`<text x="${L}" y="${H-6}">${fmtShort(ws[0].date)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fmtShort(ws[ws.length-1].date)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#gf)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p=>`<circle cx="${x(p.t)}" cy="${y(p.v)}" r="2.6" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"/>`).join("")}<circle cx="${x(lp.t)}" cy="${y(lp.v)}" r="5" fill="var(--accent)"/>${lab}</svg>`;
}
function niceStep(r){const raw=r/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}

  if(!isDog(p)||!p.birthday)return[];const a=ageParts(p.birthday);if(!a||a.weeks>=104)return[];
  return VAX_PLAN.map((s,i)=>{const rec=planRec(p,s);const done=!!rec;const target=planTarget(p,s);const d=daysUntil(target);
    const st=done?"done":d<-21?"missed":d<=14?"due":"later";return Object.assign({},s,{i,rec,done,target,d,st})});

function suggestDue(p,v){
  const n=v.name||"";if(!v.date)return"";
  const ageWk=p.birthday?Math.floor((parseD(v.date)-parseD(p.birthday))/DAY/7):null;
  const prior=k=>vaxDoses(p,k).filter(x=>x.date<=v.date).length;
  if(VRE.dhpp.test(n)){if(ageWk!=null&&ageWk<16)return addDays(v.date,21);if(prior("dhpp")>=3&&(ageWk==null||ageWk>=52))return addDays(v.date,1095);return addDays(v.date,365)}

  if(VRE.lepto.test(n))return addDays(v.date,prior("lepto")?365:21);
  if(VRE.lyme.test(n))return addDays(v.date,prior("lyme")?365:21);
  if(VRE.bordetella.test(n)||/influenza/i.test(n))return addDays(v.date,365);
  return"";

   <div class="card list">${core.map(row).join("")}</div>
   <div class="sechead" style="margin-top:4px"><h3 style="font-size:18px">Lifestyle vaccines</h3><span class="eyebrow">Ask your vet</span></div>

   <p class="note" style="margin:0">A typical Canadian schedule for puppies and young dogs. Your vet's plan comes first. Tap the circle to check off a shot (dated today). If it was given a while ago, the usual date is used. Tap the pencil to set the exact date.</p></section>`;
}

function qForm(q,asking){

/* ---------- border crossing ---------- */
const CDC_URL="https://www.cdc.gov/importation/dogs/index.html";
const CFIA_URL="https://inspection.canada.ca/en/importing-food-plants-or-animals/pets";
function borderSection(p){
  if(!isDog(p))return"";
  const six=p.birthday?addMonths(p.birthday,6):null,three=p.birthday?addMonths(p.birthday,3):null;
  const ageOk=six&&daysUntil(six)<=0,over3=three&&daysUntil(three)<=0;
  const chip=!!(p.microchip&&String(p.microchip).trim());
  const cdcUntil=p.cdcForm?addMonths(p.cdcForm,6):null,cdcOk=cdcUntil&&daysUntil(cdcUntil)>=0;
  const rab=vaxDoses(p,"rabies").slice(-1)[0];const rabUntil=rab?(rab.due||addDays(rab.date,365)):null;const rabOk=rabUntil&&daysUntil(rabUntil)>=0;
  const ck=(st,t,s,extra="")=>`<div class="row"><span class="ck ${st}">${st==="ok"?"✓":st==="no"?"!":"i"}</span><div class="main"><div class="t">${t}</div><div class="s">${s}</div>${extra}</div></div>`;
  const usTodo=[ageOk,chip,cdcOk].filter(x=>!x).length;
  return `<section class="sec"><div class="sechead"><h3>Crossing into the USA</h3>${usTodo?`<span class="pill warn">${usTodo} to do</span>`:'<span class="pill good">Ready</span>'}</div>
  <div class="card list">
   ${ck(ageOk?"ok":"no","At least 6 months old",!p.birthday?"Add a birthday in Edit to check this.":ageOk?esc(p.name)+" is "+esc(ageText(p.birthday))+".":"Not old enough yet. "+esc(p.name)+" can cross from <b>"+fmtD(six)+"</b>.")}
   ${ck(chip?"ok":"no","Microchip",chip?"#"+esc(p.microchip)+". It must be readable by a universal scanner.":"Required. Add the microchip number in Edit, or ask your vet to implant one.")}
   ${ck(cdcOk?"ok":"no","CDC Dog Import Form receipt",cdcOk?"Submitted "+fmtD(p.cdcForm)+". Good for trips from Canada until "+fmtD(cdcUntil)+". Show it on your phone or on paper.":"Free and online, one per dog. You can do it the day you travel. The receipt is good for 6 months of trips from Canada.",`<div class="ckacts"><a class="btn small ghost" href="${CDC_URL}" target="_blank" rel="noopener">Open CDC page</a><button class="btn small ghost" data-act="cdc-done">${cdcOk?"Update date":"I've submitted it"}</button></div>`)}
   ${ck("info","Looks healthy at the border","US officers can refuse a dog that looks sick.")}
   ${ck(rabOk?"ok":"info","Rabies certificate (recommended)",rabOk?"Rabies on record, valid to "+fmtD(rabUntil)+". Bring the signed certificate.":"The CDC doesn't require it for dogs from Canada, but some US states do and you need it to come home.")}
  </div></section>
  <section class="sec"><div class="sechead"><h3>Coming back to Canada</h3></div>
  <div class="card list">
   ${ck(!over3?"info":rabOk?"ok":"no","Rabies vaccination certificate",!p.birthday?"Required for dogs over 3 months.":!over3?"Under 3 months: no rabies shot needed, but bring proof of age, such as breeder papers.":rabOk?"Required for dogs over 3 months, issued by a licensed vet. Yours is on record.":"Required for dogs over 3 months, issued by a licensed vet. Log the rabies shot under Health.")}
   ${ck("info","Bring original documents","Border services recommend carrying the originals, plus proof that the dog is yours.")}
   ${ck("info","Recent travel","If your dog was in a high-risk rabies country in the last 6 months, different rules apply. Check before you go.")}
  </div>
  <p class="note" style="margin:0">Checked November 2026 against the CDC, the CFIA (via USDA's summary) and CBSA. Rules can change, so check again before each trip: <a href="${CDC_URL}" target="_blank" rel="noopener">cdc.gov</a> · <a href="${CFIA_URL}" target="_blank" rel="noopener">inspection.canada.ca</a></p></section>`;
}

/* ---------- calendar, costs & reminders ---------- */

function calState(){

  <div class="card calcard">
    <div class="calhead"><button class="icon-btn" data-act="cal-nav" data-n="-1" aria-label="Previous month">‹</button><b>${MONL[S.calM]} ${S.calY}</b><button class="icon-btn" data-act="cal-nav" data-n="1" aria-label="Next month">›</button><button class="link" data-act="cal-today">Today</button></div>

}

const icsTime=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00";
function eventInfo(a,pt){const s=parseD(a.when);const e=new Date(s.getTime()+3600000);
  const title=pt.name+" – "+(a.title?a.type+": "+a.title:a.type);
  const qs=(a.type==="Vet"||a.type==="Vaccine")?openQs(S.pets.find(x=>x.id===pt.id)||pt):[];
  const desc=[a.notes,a.cost?"Cost: "+money(a.cost):"",qs.length?"Questions for the vet:\n"+qs.map(q=>"• "+q.text).join("\n"):"","Added from Pupdate"].filter(Boolean).join("\n");return {s,e,title,desc}}
function buildICS(a,pt){const {s,e,title,desc}=eventInfo(a,pt);const m=REMIND[a.remind]||0;
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Pupdate//Pet care//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT","UID:"+a.id+"@pawlette","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,""),"DTSTART:"+icsTime(s),"DTEND:"+icsTime(e),"SUMMARY:"+icsEsc(title)];
  if(a.where)L.push("LOCATION:"+icsEsc(a.where));L.push("DESCRIPTION:"+icsEsc(desc));
  if(m)L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(title),"TRIGGER:-PT"+m+"M","END:VALARM");
  L.push("END:VEVENT","END:VCALENDAR");return L.join("\r\n")+"\r\n"}
function googleLink(a,pt){const {s,e,title,desc}=eventInfo(a,pt);return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title)+"&dates="+icsTime(s)+"/"+icsTime(e)+"&details="+encodeURIComponent(desc)+(a.where?"&location="+encodeURIComponent(a.where):"")}
function saveICS(a,pt){
  const blob=new Blob([buildICS(a,pt)],{type:"text/calendar;charset=utf-8"});
  const name=(pt.name+"-"+(a.title||a.type)).replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase()+".ics";
  const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download=name;document.body.appendChild(link);link.click();
  setTimeout(()=>{URL.revokeObjectURL(url);link.remove()},4000);
  S.lastICS=name;
}
function remindSheet(a,pt,justBooked){
  formCtx={};S.remEv={a,pt};
  const {title}=eventInfo(a,pt);const r=a.remind&&REMIND[a.remind]?a.remind:"No reminder";
  $("#panel").innerHTML=`<div style="display:flex;flex-direction:column;gap:14px"><h3>${justBooked?"Booked! Add a reminder?":"Add a reminder"}</h3>
   <div class="card" style="box-shadow:none"><div class="t" style="font-weight:700">${esc(title)}</div><div class="s" style="color:var(--muted)">${fmtD(a.when)} · ${fmtTime(a.when)}${a.where?" · "+esc(a.where):""}</div><div class="s" style="color:var(--muted);margin-top:4px">${I.bell} Alert: ${esc(r.toLowerCase())}</div></div>
   <p style="margin:0;color:var(--muted);font-size:14px">Your phone's calendar will send the reminder, even when Pupdate is closed.${(a.type==="Vet"||a.type==="Vaccine")&&openQs(pt).length?" Your "+openQs(pt).length+" open vet question"+(openQs(pt).length>1?"s are":" is")+" added to the event notes.":""}</p>
   <button class="btn" data-act="ics" data-id="${a.id}">Add to iPhone Calendar</button>
   <a class="btn ghost" style="text-align:center;text-decoration:none" href="${esc(googleLink(a,pt))}" target="_blank" rel="noopener">Add to Google Calendar</a>
   <button class="btn ghost" data-act="close">Not now</button></div>`;
  $("#sheet").hidden=false;
}
function reminderBanner(){
  const due=allAppts(null).filter(({a})=>{if(a.done)return false;const m=minsUntil(a.when);const w=Math.max(REMIND[a.remind]||0,0);return m!=null&&m>=0&&(m<=w||daysUntil(a.when)<=1)&&a.remind!=="No reminder"});
  if(!due.length)return"";
  return `<div class="remind">${due.map(({a,pt})=>{const n=daysUntil(a.when);return `<button class="remrow" data-act="cal-go" data-d="${a.when.slice(0,10)}"><span class="bellc">${I.bell}</span><span style="min-width:0;flex:1;text-align:left"><b>${n===0?"Today":n===1?"Tomorrow":WDL[parseD(a.when).getDay()]} ${fmtTime(a.when)}</b> · ${esc(apptName(a,pt))}${a.where?`<br><small>${esc(a.where)}</small>`:""}</span></button>`}).join("")}</div>`;
}

/* ---------- toast ---------- */
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  if(e.target.id==="sheet"){closeSheet();return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,p=cur();
  switch(a){
    case "settings":closeSheet();if(prefs.tab!=="settings")prefs.lastTab=prefs.tab;prefs.tab="settings";savePrefs();render();window.scrollTo(0,0);break;
    case "go-health":prefs.tab="health";savePrefs();render();window.scrollTo(0,0);break;
    case "vax-remind":{const v=findIn("vaccines",id);if(v)remindSheet({id:"vx-"+v.id,type:"Vaccine",title:v.name+" due",when:v.due+"T09:00",where:p.vetName||"",remind:"1 week before"},p,false);break}
    case "plan-check":{const it=planItems(p).find(x=>x.pid===b.dataset.pid);if(!it)break;
      if(it.done){update(c=>{c.vaccines=c.vaccines.filter(v=>v.id!==it.rec.id)});toast("Unchecked "+it.label)}
      else{const est=it.st==="missed";const date=est?it.target:todayISO();const v={id:uid(),name:VAX_NAMES[it.key],date,vet:"",plan:it.pid,notes:est?"Date estimated from the usual schedule. Edit if you know the exact date.":""};v.due=suggestDue(p,v);
        update(c=>{c.vaccines=c.vaccines||[];c.vaccines.push(v)});toast("✓ "+it.label+(est?" · dated "+fmtShort(date)+" (estimated)":" · given today")+(v.due?" · next due "+fmtD(v.due):""))}
      break}
    case "plan-remind":{const it=planItems(p).find(x=>x.pid===b.dataset.pid);if(it)remindSheet({id:"plan-"+p.id+"-"+it.i,type:"Vaccine",title:it.label+" due",when:it.target+"T09:00",where:p.vetName||"",remind:"1 week before"},p,false);break}
    case "q-done":{const q=findIn("questions",id);if(q)qForm(q,true);break}
    case "q-edit":{const q=findIn("questions",id);if(q)qForm(q,false);break}
    case "cdc-done":openForm({title:"CDC Dog Import Form",fields:[{k:"cdcForm",label:"Date you submitted it",type:"date",def:todayISO(),req:true}],values:{cdcForm:p.cdcForm},onSave(v){update(c=>{c.cdcForm=v.cdcForm});toast("Saved · good until "+fmtD(addMonths(v.cdcForm,6)))}});break;
    case "tab":prefs.tab=b.dataset.tab;savePrefs();render();window.scrollTo(0,0);break;
    case "pick":prefs.cur=id;savePrefs();render();break;
    case "pet-new":petForm(null);break;
    case "pet-edit":petForm(p);break;
    case "sample":{const s=samplePet();prefs.cur=s.id;prefs.tab="home";savePrefs();persistPet(s);break}
    case "unit":prefs.unit=b.dataset.u;savePrefs();render();break;
    case "w-new":listForm("weights",null,"Log weight",W_FIELDS(),{unitField:"lb"});break;
    case "w-edit":{const w=findIn("weights",id);openWeightEdit(w);break}
    case "vax-new":vaxForm(null);break;
    case "vax-plan":vaxForm(null,b.dataset.name);break;
    case "vax-edit":vaxForm(findIn("vaccines",id));break;
    case "med-new":listForm("meds",null,"Add medication",MED_FIELDS);break;
    case "med-edit":listForm("meds",findIn("meds",id),"Edit medication",MED_FIELDS);break;
    case "med-give":update(c=>{const m=c.meds.find(x=>x.id===id);if(m)m.last=todayISO()});toast("Marked as given today");break;
    case "visit-new":listForm("visits",null,"Add vet visit",VISIT_FIELDS);break;
    case "visit-edit":listForm("visits",findIn("visits",id),"Edit vet visit",VISIT_FIELDS);break;
    case "appt-new":apptForm(null,b.dataset.d||null);break;
    case "appt-edit":{const f=findAppt(id);if(f)apptForm(f);break}
    case "appt-log":{const f=findAppt(id);if(f)logForm(f);break}
    case "appt-remind":{const f=findAppt(id);if(f)remindSheet(f.a,f.pt,false);break}
    case "ics":{const f=S.remEv;if(f){saveICS(f.a,f.pt);closeSheet();toast("Calendar file ready. Tap Add to save it.")}break}
    case "cal-day":S.calDay=b.dataset.d;{const d=parseD(S.calDay);if(d.getMonth()!==S.calM){S.calY=d.getFullYear();S.calM=d.getMonth()}}render();break;
    case "cal-nav":{calState();const d=new Date(S.calY,S.calM+Number(b.dataset.n),1);S.calY=d.getFullYear();S.calM=d.getMonth();S.calDay=iso(d);render();break}
    case "cal-today":S.calY=null;calState();render();break;
    case "cal-scope":S.calScope=b.dataset.s;render();break;
    case "cal-go":{calState();S.calDay=b.dataset.d;const d=parseD(S.calDay);S.calY=d.getFullYear();S.calM=d.getMonth();prefs.tab="cal";savePrefs();render();window.scrollTo(0,0);break}
    case "copy":{const v=b.dataset.v;try{navigator.clipboard.writeText(v).then(()=>toast("Copied"),()=>toast(v))}catch(err){toast(v)}break}
    case "close":closeSheet();break;
    case "backup":exportBackup();break;
    case "restore":$("#restoreFile").value="";$("#restoreFile").click();break;
    case "hide-install":prefs.hideInstall=true;savePrefs();render();break;
    case "del-ask":$("#confirmBox").innerHTML=`<div class="confirm"><div>${esc(formCtx.delLabel||"Delete this?")}</div><div style="display:flex;gap:10px"><button type="button" class="btn small" style="background:var(--bad);color:var(--surface)" data-act="del-yes">Yes, delete</button><button type="button" class="btn ghost small" data-act="del-no">Keep</button></div></div>`;break;
    case "del-no":$("#confirmBox").innerHTML="";break;
    case "del-yes":{const fn=formCtx.onDelete;closeSheet();fn&&fn();break}
  }
});
function openWeightEdit(w){
  listForm("weights",null,"Edit weigh-in",W_FIELDS(),{unitField:"lb",values:weightItemForForm(w),
    onSave(v){update(c=>{const i=c.weights.findIndex(x=>x.id===w.id);c.weights[i]=Object.assign({},w,v)});toast("Saved")},
    onDelete(){update(c=>{c.weights=c.weights.filter(x=>x.id!==w.id)});toast("Deleted")}});
}
document.addEventListener("submit",e=>{if(e.target.id!=="qform")return;e.preventDefault();const t=$("#q_text").value.trim();if(!t){$("#q_text").focus();return}
  update(c=>{c.questions=c.questions||[];c.questions.push({id:uid(),text:t,date:todayISO(),status:"open"})});toast("Added to your vet list");setTimeout(()=>{const i=$("#q_text");i&&i.focus()},50)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet()});

$("#breeds").innerHTML=CKC.map(b=>`<option value="${esc(b.n)}">`).join("")+'<option value="Mixed breed">';
$("#restoreFile").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)importBackup(f)});
render();
initStore();
if(prefs.seenVersion!==APP_VERSION){if(S.pets.length&&prefs.seenVersion!==undefined||S.pets.length&&!prefs.seenVersion)showWhatsNew();prefs.seenVersion=APP_VERSION;savePrefs()}
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
